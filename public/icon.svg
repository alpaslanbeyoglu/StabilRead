<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with safe zone border -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Outer Vibration Wave Ring (Simulated Car Jitter) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#F43F5E" stroke-width="6" stroke-dasharray="16 12" opacity="0.4" />
  
  <!-- Stabilized Gyro Dynamic Horizon Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#38BDF8" stroke-width="8" opacity="0.6" />
  
  <!-- Counter-Inertial Book / Shield Core -->
  <g filter="url(#glow)">
    <path d="M150 170 C190 155, 230 165, 256 185 C282 165, 322 155, 362 170 L362 330 C322 315, 282 325, 256 345 C230 325, 190 315, 150 330 Z" 
          fill="none" stroke="url(#emeraldGrad)" stroke-width="18" stroke-linejoin="round" />
    <!-- Center Spine Spine Line -->
    <line x1="256" y1="185" x2="256" y2="345" stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round" />
    <!-- Dynamic Optical Crosshairs -->
    <circle cx="256" cy="256" r="22" fill="#10B981" />
    <circle cx="256" cy="256" r="8" fill="#FFFFFF" />
  </g>
</svg>
